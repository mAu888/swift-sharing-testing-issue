name: Tests

# The repro is a single deterministic test, so one `swift test` is enough:
#   - on `main` (released swift-sharing 2.8.0) the job is RED — it reproduces the
#     dropped-write bug.
#   - on `with-fix` (the patched dependency) the job is GREEN.
#
# FileStorageKey only exists on Apple platforms, so this runs on macOS.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Versions
        run: swift --version

      # Resolve swift-sharing's `main` to its current HEAD so each run tests the
      # latest development changes (not a stale pin).
      - name: Update to latest swift-sharing main
        run: swift package update swift-sharing

      - name: Run tests
        run: swift test
